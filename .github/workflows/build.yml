name: Build and Test App

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # macOS-specific system dependencies
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cairo pango gdk-pixbuf libffi

      # Windows-specific system dependencies (if needed)
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          # WeasyPrint on Windows needs GTK3 runtime
          echo "Windows WeasyPrint dependencies need special handling"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -s tests/

  build:
    name: Build on ${{ matrix.os }}
    needs: test
    if: github.ref == 'refs/heads/master'
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pango gdk-pixbuf libffi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the application
        run: python build_application/build.py build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyApp_${{ matrix.os }}
          path: dist/