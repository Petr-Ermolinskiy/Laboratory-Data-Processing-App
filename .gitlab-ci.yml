stages:
  - test
  - build

variables:
  WINDOWS_IMAGE: "python:3.11-windowsservercore-1809"
  MACOS_IMAGE: "python:3.11"

# ============================================
# TEST STAGE
# ============================================
test:
  stage: test
  parallel:
    matrix:
      - OS: [windows, macos]
  tags:
    - $OS == "windows" : shared-windows
    - $OS == "macos"   : macos-12
  image: $OS == "windows" ? $WINDOWS_IMAGE : $MACOS_IMAGE
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - echo "Running tests on $OS..."
    - python -m pytest -s tests/
  artifacts:
    when: always
    paths:
      - test-reports/
    reports:
      junit: test-reports/junit.xml
  only:
    - main
    - merge_requests

# ============================================
# BUILD STAGE
# ============================================
build:
  stage: build
  needs: ["test"]
  parallel:
    matrix:
      - OS: [windows, macos]
  tags:
    - $OS == "windows" : shared-windows
    - $OS == "macos"   : macos-12
  image: $OS == "windows" ? $WINDOWS_IMAGE : $MACOS_IMAGE
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - echo "Building for $OS..."
    - python build_application/build.py build
  artifacts:
    name: "MyApp_$OS"
    paths:
      - dist/
    expire_in: 30 days
  only:
    - main